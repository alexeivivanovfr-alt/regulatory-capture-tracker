[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "regulatory-capture-tracker"
version = "0.1.0"
description = "Detect regulatory capture in US federal agencies using public data"
requires-python = ">=3.11"

dependencies = [
    # Data fetching & processing
    "httpx>=0.27",           # Async HTTP client
    "duckdb>=0.10",          # Fast analytical queries on raw files
    "pandas>=2.2",           # Data manipulation
    "polars>=0.20",          # Fast DataFrame alternative for large files

    # Entity resolution
    "recordlinkage>=0.16",   # Probabilistic record matching
    "sentence-transformers>=2.7",  # Semantic embeddings for name matching
    "rapidfuzz>=3.9",        # Fast fuzzy string matching

    # XML parsing (lobbying disclosures)
    "lxml>=5.2",

    # Graph database
    "neo4j>=5.20",           # Neo4j Python driver

    # AI / LLM
    "anthropic>=0.28",       # Claude API for language provenance

    # Pipeline orchestration
    "prefect>=2.19",         # Workflow orchestration

    # API
    "fastapi>=0.111",
    "uvicorn>=0.30",

    # Utilities
    "python-dotenv>=1.0",    # Environment variables
    "rich>=13.7",            # Pretty terminal output
    "typer>=0.12",           # CLI interface
    "pydantic>=2.7",         # Data validation
    "tenacity>=8.3",         # Retry logic for API calls
    "tqdm>=4.66",            # Progress bars
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",             # Linting
    "ipykernel>=6.29",       # Jupyter for exploration
]

[project.scripts]
rct = "pipeline.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
